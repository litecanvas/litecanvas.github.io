<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Litecanvas Preview</title>
    <style>
      html,
      body {
        height: 100%;
        background-color: #000;
        color: white;
      }
      body {
        margin: 0;
      }
      #err {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: blue;
        color: white;
        font-weight: bold;
        font-family: monospace;
        padding: 1em;
        font-size: 32px;
        z-index: 1000;
        box-sizing: border-box;
        line-height: 1.5;
      }

      #err-tip {
        font-family: sans-serif;
        font-weight: normal;
        opacity: 90%;
        font-size: 20px;
      }

      #err-tip code {
        background: rgba(0, 0, 0, 0.2);
      }

      canvas {
        display: block;
        background-image: repeating-conic-gradient(#fefefe 0% 25%, #ddd 0% 50%);
        background-position:
          0 0,
          0px 0px;
        background-size: 64px 64px;
      }
    </style>
  </head>
  <body>
    <div id="err" style="display: none">
      <p id="err-tip">
        Tip: If you are loading any asset (script, font, image etc), don't
        forget to add <code>if (LOADING > 0) return;</code> at the beginning of
        your <code>update</code> and <code>draw</code> functions.
      </p>
    </div>

    <!-- the editor user code -->
    <script id="code" type="text/plain"></script>

    <script>
      (() => {
        const codeTag = document.querySelector("script#code");
        _checkUserCode();

        function _checkUserCode() {
          if (codeTag.innerHTML) {
            _startPreview();
          } else {
            setTimeout(_checkUserCode, 100);
          }
        }

        function _startPreview() {
          const debugMode = localStorage.getItem("debug_mode_on") === "yes";

          if (debugMode) {
            // blue screen of death
            let errorMessage = null;
            handleError = (e) => {
              if (errorMessage) return;
              errorMessage = e.message || e.reason;
              if (errorMessage.includes("Potential infinite loop")) {
                errorMessage = "Error: Potential infinite loop";
                window["err-tip"].textContent =
                  "Tip: Check your code loops (for, while, etc)";
              }
              console.error(errorMessage);
              err.prepend(errorMessage);
              err.style.display = "block";
            };
            addEventListener("error", handleError);
            addEventListener("unhandledrejection", handleError);

            const erudaScript = document.createElement("script");
            erudaScript.src = "./js/eruda.js";
            erudaScript.onload = () => {
              // init eruda console
              const tools = ["console", "elements", "network", "info"];
              eruda.init({
                tool: tools,
                defaults: {
                  displaySize: 30,
                  transparency: 0.95,
                  theme: "Dark",
                },
              });

              eruda.get("console").config.set("maxLogNum", "250");
              eruda.get("console").config.set("displayIfErr", true);

              // save devtools state
              const devtools = eruda.get();
              devtools.on("show", () => {
                localStorage.setItem("console_open", 1);
              });
              devtools.on("hide", () => {
                localStorage.removeItem("console_open");
              });
              devtools.on("showTool", (name) => {
                localStorage.setItem("console_tab", name);
              });
              // maybe restore devtools on reload
              if (localStorage.getItem("console_open")) {
                const tab = localStorage.getItem("console_tab") || tools[0];
                eruda.show();
                devtools.showTool(tab);
              }

              loadUserCode();
            };
            document.body.appendChild(erudaScript);
          } else {
            loadUserCode();
          }

          function loadUserCode() {
            const litecanvasScript = document.createElement("script");
            litecanvasScript.src = `./js/litecanvas${debugMode ? ".dev" : ""}.js`;
            litecanvasScript.onload = () => {
              const _litecanvas = window.litecanvas;
              // expose the utils to global context
              utils.global(false);

              window.litecanvas = (settings = {}) => {
                const instance = _litecanvas(settings);

                // load plugins
                instance.use(pluginMigrate);
                instance.use(pluginFrameRateMeter, {
                  hidden: !debugMode,
                });
                instance.use(pluginPixelFont);
                instance.listen("before:init", () => {
                  instance.use(pluginAssetLoader);
                  instance.use(pluginJoystick);
                  joystick.disable();
                });

                window.__litecanvasCalled = true;

                return instance;
              };

              const codeRunner = document.createElement("script");
              codeRunner.innerHTML = codeTag.innerHTML;
              setTimeout(() => {
                if (!window.__litecanvasCalled) {
                  throw new Error("You must call the litecanvas() function");
                }
              }, 100);
              document.body.append(codeRunner);
              codeTag.remove();
            };
            document.body.appendChild(litecanvasScript);
          }
        }
      })();
    </script>
  </body>
</html>
